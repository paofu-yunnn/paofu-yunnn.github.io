<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>泡芙🐈藏書室</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="泡芙的文字角色扮演劇本與角色卡。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080c;
      --bg-2: #0d1118;
      --navy: #141a28;
      --navy-2: #1b2336;
      --gold: #c9a84c;
      --gold-soft: #e8d5a3;
      --gold-dim: rgba(201, 168, 76, .22);
      --text: #efe8d8;
      --muted: #9a9283;
      --line: rgba(232, 213, 163, .16);
      --card: #121826;
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(201,168,76,.08), transparent 55%),
        radial-gradient(900px 500px at -10% 20%, rgba(40,60,110,.18), transparent 50%),
        var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }
    a { color: inherit; }
    .wrap { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    header.hero {
      padding: 72px 0 48px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .kicker {
      color: var(--gold);
      letter-spacing: .28em;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    .hero h1 {
      font-family: "Noto Serif TC", "Songti TC", serif;
      font-weight: 700;
      font-size: clamp(36px, 6vw, 64px);
      letter-spacing: .08em;
      line-height: 1.15;
    }
    .hero h1 span {
      display: block;
      font-size: .38em;
      font-weight: 500;
      letter-spacing: .22em;
      color: var(--gold-soft);
      margin-top: 12px;
      opacity: .9;
    }
    .ornament {
      width: 72px;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin: 28px 0 24px;
    }
    .hero p.lead {
      max-width: 38em;
      color: var(--muted);
      font-size: 16px;
    }
    .stats {
      display: flex;
      gap: 28px;
      margin-top: 32px;
      color: var(--gold-soft);
      font-size: 13px;
      letter-spacing: .08em;
    }
    .stats b {
      font-family: "Noto Serif TC", serif;
      font-size: 22px;
      color: var(--text);
      display: block;
      letter-spacing: 0;
    }
    .site-nav {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }
    .site-nav a {
      text-decoration: none;
      border: 1px solid var(--line);
      background: rgba(20,26,40,.7);
      color: var(--gold-soft);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      letter-spacing: .12em;
      transition: .2s ease;
    }
    .site-nav a:hover, .site-nav a:focus-visible {
      border-color: var(--gold);
      background: rgba(201,168,76,.12);
      outline: none;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 28px 0 8px;
    }
    .section-head h2 {
      font-family: "Noto Serif TC", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: .16em;
    }
    .section-head .hint {
      color: var(--muted);
      font-size: 13px;
    }
    #characters .section-head { padding-top: 24px; }

    .filter-sentinel {
      height: 1px;
      margin-bottom: -1px;
      pointer-events: none;
      visibility: hidden;
    }
    .filter-dock {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 24px 0 22px;
    }
    .filter-dock::before {
      content: "";
      position: absolute;
      inset: 0 calc(50% - 50vw);
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(7,8,12,.96) 70%, rgba(7,8,12,0));
    }
    .filter-dock.is-stuck {
      padding-top: max(10px, env(safe-area-inset-top, 0px));
      padding-bottom: 10px;
    }
    .filter-dock.is-stuck::before {
      background: rgba(7, 8, 12, .94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(0,0,0,.4);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 1;
      min-width: 0;
      position: relative;
    }
    .filter-dock.is-stuck:not(.is-open) .toolbar {
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    .filter-dock.is-stuck:not(.is-open) .toolbar::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    .filter-dock.is-stuck:not(.is-open) .chip {
      flex: 0 0 auto;
    }
    .filter-toggle {
      display: none;
      flex: 0 0 auto;
      appearance: none;
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .12em;
      color: var(--gold);
      border: 1px solid var(--gold);
      background: rgba(16, 22, 35, .92);
      border-radius: 999px;
      padding: 6px 12px;
      line-height: 1.4;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-start;
    }
    .filter-dock.is-stuck .filter-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .filter-toggle:hover,
    .filter-toggle:focus-visible {
      background: rgba(201,168,76,.2);
      color: var(--gold-soft);
      outline: none;
    }
    html, body { overflow-anchor: none; }
    .chip {
      flex-shrink: 0;
      white-space: nowrap;
      border: 1px solid var(--line);
      background: rgba(20,26,40,.7);
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: color .2s ease, background-color .2s ease, border-color .2s ease;
    }
    .chip:hover, .chip.is-on {
      border-color: var(--gold);
      color: var(--gold-soft);
      background: rgba(201,168,76,.12);
    }

    .grid, .char-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      padding: 8px 0 64px;
    }
    @media (max-width: 900px) {
      .grid, .char-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }
    @media (max-width: 620px) {
      .wrap { width: min(1180px, calc(100% - 28px)); }
      .grid { grid-template-columns: 1fr; }
      .char-grid { grid-template-columns: repeat(2, 1fr); }
      header.hero { padding: 48px 0 32px; }
      .section-head h2 { font-size: 24px; }
    }

    .card {
      background: linear-gradient(180deg, var(--navy-2), var(--card));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
      display: flex;
      flex-direction: column;
      text-align: left;
      color: inherit;
      width: 100%;
      font: inherit;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(201,168,76,.45);
      box-shadow: 0 22px 50px rgba(0,0,0,.55), 0 0 0 1px rgba(201,168,76,.15);
      outline: none;
    }
    .cover-frame, .portrait-frame {
      width: 100%;
      background: #0a0e16;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cover-frame { aspect-ratio: 16 / 9; }
    .portrait-frame { aspect-ratio: 3 / 4; }
    .cover-frame img, .portrait-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .ph, .ph-portrait {
      width: 100%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, rgba(201,168,76,.16), transparent 50%),
        linear-gradient(160deg, #161c2c, #0b0e16 70%);
      position: relative;
      overflow: hidden;
    }
    .ph { aspect-ratio: 16 / 9; }
    .ph-portrait { aspect-ratio: 3 / 4; }
    .ph::before, .ph-portrait::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1px solid var(--gold-dim);
      border-radius: 8px;
    }
    .ph-mark {
      font-family: "Noto Serif TC", serif;
      color: var(--gold);
      letter-spacing: .2em;
      font-size: 13px;
      opacity: .85;
      z-index: 1;
      text-align: center;
      padding: 0 12px;
    }
    .body { padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      appearance: none;
      font: inherit;
      font-size: 11px;
      letter-spacing: .04em;
      color: var(--gold-soft);
      border: 1px solid var(--gold-dim);
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(201,168,76,.06);
      cursor: pointer;
    }
    .tag:hover, .tag.is-on, .tag:focus-visible {
      border-color: var(--gold);
      background: rgba(201,168,76,.14);
      color: var(--gold-soft);
      outline: none;
    }
    .empty-msg {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .06em;
      padding: 12px 0 40px;
    }
    .body h2, .body h3 {
      font-family: "Noto Serif TC", serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .04em;
      line-height: 1.4;
    }
    .subtitle {
      color: var(--gold-soft);
      font-size: 12px;
      letter-spacing: .08em;
      margin-top: -6px;
    }
    .body p {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.75;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .more {
      margin-top: auto;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .12em;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 32px 0 calc(72px + env(safe-area-inset-bottom, 0px));
      color: var(--muted);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    footer .credit {
      color: var(--gold-soft);
      letter-spacing: .08em;
    }
    footer a { color: var(--gold); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .hidden { display: none !important; }
  
    .back-to-top {
      position: fixed;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: max(16px, calc(12px + env(safe-area-inset-bottom, 0px)));
      z-index: 30;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      background: rgba(16, 22, 35, .92);
      color: var(--gold);
      box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 0 1px rgba(201,168,76,.16);
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .22s ease, transform .22s ease, background .2s ease;
      padding: 0;
    }
    .back-to-top.is-on {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }
    .back-to-top:hover,
    .back-to-top:focus-visible {
      background: rgba(201,168,76,.2);
      color: var(--gold-soft);
      outline: none;
    }
    .back-to-top svg { width: 20px; height: 20px; display: block; }
    @media (max-width: 620px) {
      .back-to-top {
        width: 44px;
        height: 44px;
        right: max(14px, env(safe-area-inset-right, 0px));
        bottom: max(20px, calc(16px + env(safe-area-inset-bottom, 0px)));
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="kicker">劇本　・　角色卡</div>
      <h1>泡芙🐈藏書室<span>文字角色扮演　戀愛模擬器模板</span></h1>
      <div class="ornament"></div>
      <p class="lead">這裡收藏泡芙寫的文字角色扮演劇本，還有可以單獨遊玩的角色卡。點進卡片就能看簡介與封面。</p>
      <div class="stats">
        <div><b id="count">0</b>部劇本</div>
        <div><b id="charCount">0</b>張角色卡</div>
      </div>
      <nav class="site-nav" aria-label="頁面導覽">
        <a href="#scripts">劇本</a>
        <a href="#characters">角色卡</a>
      </nav>
    </header>

    <div class="filter-sentinel" id="filterSentinel" aria-hidden="true"></div>
    <div class="filter-dock" id="filterDock">
      <div class="toolbar" id="filters" role="toolbar" aria-label="分類篩選"></div>
      <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filters">展開</button>
    </div>

    <section id="scripts">
      <div class="section-head">
        <h2>劇本</h2>
        <div class="hint">點進卡片即可查看詳情頁</div>
      </div>
      <div class="grid" id="grid" aria-label="劇本列表"></div>
    </section>

    <section id="characters">
      <div class="section-head">
        <h2>角色卡</h2>
        <div class="hint">點進卡片即可查看詳情頁</div>
      </div>
      <div class="char-grid" id="charGrid" aria-label="角色卡列表"></div>
    </section>

    <footer>
      <div class="credit">泡芙Yunnn.cc</div>
      <div>有問題歡迎到 <a href="https://discord.gg/wNgvn5wBC" target="_blank" rel="noopener">Lunly 的 Discord 社群</a> 找我，直接 @泡芙Yunnn</div>
    </footer>
  </div>


<script src="scripts.js"></script>
<script>
const COVER_DIR = "assets/covers/";
const PORTRAIT_DIR = "assets/portraits/";

const grid = document.getElementById("grid");
const charGrid = document.getElementById("charGrid");
const filtersEl = document.getElementById("filters");
const countEl = document.getElementById("count");
const charCountEl = document.getElementById("charCount");
let current = "全部";

function workKey(w, i) {
  return String(w.id || (i + 1)).padStart(2, "0");
}

function coverSrc(w) {
  const name = (w.cover || "").trim();
  return name ? COVER_DIR + name : "";
}

function portraitSrc(c) {
  const name = (c.portrait || "").trim();
  return name ? PORTRAIT_DIR + name : "";
}

function coverHTML(w, i) {
  const no = workKey(w, i);
  const src = coverSrc(w);
  if (src) {
    return `<div class="cover-frame"><img src="${src}" alt="《${escapeHTML(w.title)}》封面"></div>`;
  }
  return `<div class="ph"><div class="ph-mark">NO. ${no}　封面待補</div></div>`;
}

function portraitHTML(c) {
  const src = portraitSrc(c);
  if (src) {
    return `<div class="portrait-frame"><img src="${src}" alt="${escapeHTML(c.title)} 肖像"></div>`;
  }
  return `<div class="ph-portrait"><div class="ph-mark">肖像待補</div></div>`;
}

function escapeHTML(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

const HIDDEN_TAGS = { "18禁": true };

function visibleTags(tags) {
  return (tags || []).filter(t => t && !HIDDEN_TAGS[t]);
}

function collectFilterNames() {
  const seen = new Set();
  for (const item of [...(WORKS || []), ...(CHARACTERS || [])]) {
    for (const t of visibleTags(item.tags)) seen.add(t);
  }
  const preferred = (FILTERS || []).filter(n => n && n !== "全部" && !HIDDEN_TAGS[n] && seen.has(n));
  const names = ["全部", ...preferred];
  if (current && current !== "全部" && !names.includes(current) && seen.has(current)) {
    names.push(current);
  }
  return names;
}

function scrollActiveFilterChip() {
  const dock = document.getElementById("filterDock");
  if (!dock || !filtersEl) return;
  if (!dock.classList.contains("is-stuck") || dock.classList.contains("is-open")) return;
  const on = filtersEl.querySelector(".chip.is-on");
  if (!on) return;
  const left = on.offsetLeft, right = left + on.offsetWidth;
  const viewL = filtersEl.scrollLeft, viewR = viewL + filtersEl.clientWidth;
  if (left >= viewL && right <= viewR) return; // 已經看得到就不要動
  const target = left < viewL ? left - 8 : right - filtersEl.clientWidth + 8;
  filtersEl.scrollTo({ left: Math.max(0, target), behavior: "auto" });
}

function renderFilterChips() {
  if (!filtersEl) return;
  filtersEl.innerHTML = "";
  collectFilterNames().forEach(name => {
    const b = document.createElement("button");
    b.className = "chip" + (name === current ? " is-on" : "");
    b.type = "button";
    b.dataset.filter = name;
    b.textContent = name;
    b.addEventListener("click", () => applyFilter(name));
    filtersEl.appendChild(b);
  });
  scrollActiveFilterChip();
}

function matchesFilter(item) {
  if (current === "全部") return true;
  return visibleTags(item.tags).includes(current);
}

function applyFilter(name) {
  if (!name) return;
  current = name;
  renderFilterChips();
  render();
  renderCharacters();
}

function tagHTML(tags, withHash) {
  return visibleTags(tags).map(t => {
    const label = withHash && !String(t).startsWith("#") ? "#" + t : t;
    const on = current === t ? " is-on" : "";
    return `<button type="button" class="tag${on}" data-filter="${escapeHTML(t)}">${escapeHTML(label)}</button>`;
  }).join("");
}

function displayCharTitle(c) {
  if (c.title === "夜" && (c.subtitle || "").toUpperCase() === "NIGHT") {
    return "夜【NIGHT】";
  }
  return c.title;
}

function render() {
  const list = (WORKS || []).map((w, i) => ({ w, i })).filter(({ w }) => matchesFilter(w));
  if (!list.length) {
    grid.innerHTML = `<p class="empty-msg">沒有符合的作品</p>`;
    return;
  }
  grid.innerHTML = list.map(({ w, i }) => {
    const id = w.id || String(i + 1);
    return `
    <a class="card" href="detail.html?id=${encodeURIComponent(id)}" aria-label="查看《${escapeHTML(w.title)}》介紹">
      ${coverHTML(w, i)}
      <div class="body">
        <div class="tags">${tagHTML(w.tags)}</div>
        <h2>${escapeHTML(w.title)}</h2>
        <p>${escapeHTML(w.short)}</p>
        <div class="more">查看介紹　→</div>
      </div>
    </a>`;
  }).join("");
}

function renderCharacters() {
  const list = (CHARACTERS || []).map((c, i) => ({ c, i })).filter(({ c }) => matchesFilter(c));
  if (!list.length) {
    charGrid.innerHTML = `<p class="empty-msg">沒有符合的作品</p>`;
    return;
  }
  charGrid.innerHTML = list.map(({ c, i }) => {
    const title = displayCharTitle(c);
    const sub = (c.subtitle && title.indexOf(c.subtitle) === -1) ? `<div class="subtitle">${escapeHTML(c.subtitle)}</div>` : "";
    const id = c.id || String(i + 1);
    return `
    <a class="card" href="detail.html?type=char&id=${encodeURIComponent(id)}" aria-label="查看${escapeHTML(title)}介紹">
      ${portraitHTML(c)}
      <div class="body">
        <div class="tags">${tagHTML(c.tags, true)}</div>
        <h3>${escapeHTML(title)}</h3>
        ${sub}
        <p>${escapeHTML(c.short)}</p>
        <div class="more">查看介紹　→</div>
      </div>
    </a>`;
  }).join("");
}

function onCardTagClick(e) {
  const tag = e.target.closest("button.tag");
  if (!tag) return;
  e.preventDefault();
  e.stopPropagation();
  applyFilter(tag.dataset.filter);
}
grid.addEventListener("click", onCardTagClick, true);
charGrid.addEventListener("click", onCardTagClick, true);

renderFilterChips();

if (countEl) countEl.textContent = String((WORKS || []).length);
if (charCountEl) charCountEl.textContent = String((CHARACTERS || []).length);
render();
renderCharacters();

(function setupStickyFilter() {
  const dock = document.getElementById("filterDock");
  const sentinel = document.getElementById("filterSentinel");
  const toggle = document.getElementById("filterToggle");
  if (!dock || !sentinel || !toggle) return;

  const syncToggle = () => {
    const open = dock.classList.contains("is-open");
    toggle.textContent = open ? "收起" : "展開";
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  };

  const setStuck = (stuck) => {
    if (!stuck) dock.classList.remove("is-open");
    dock.classList.toggle("is-stuck", stuck);
    syncToggle();
    if (stuck) requestAnimationFrame(scrollActiveFilterChip);
  };

  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => {
      setStuck(!entries[0].isIntersecting);
    }, { threshold: 0 });
    io.observe(sentinel);
  } else {
    const onScroll = () => setStuck(sentinel.getBoundingClientRect().top < 0);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  toggle.addEventListener("click", () => {
    if (!dock.classList.contains("is-stuck")) return;
    dock.classList.toggle("is-open");
    syncToggle();
    if (!dock.classList.contains("is-open")) requestAnimationFrame(scrollActiveFilterChip);
  });
})();
</script>

  <button type="button" class="back-to-top" id="backToTop" aria-label="回到頂端" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M12 6.2l6.4 6.4-1.4 1.4-4-4V19h-2V9.99l-4 4-1.4-1.4L12 6.2z"/>
    </svg>
  </button>

<script>
(function () {
  const btn = document.getElementById("backToTop");
  if (!btn) return;
  const toggle = () => {
    const show = window.scrollY > 400;
    btn.classList.toggle("is-on", show);
    btn.hidden = !show;
  };
  window.addEventListener("scroll", toggle, { passive: true });
  toggle();
  btn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
})();
</script>
